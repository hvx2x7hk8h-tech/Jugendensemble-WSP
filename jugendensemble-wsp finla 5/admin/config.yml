backend:
  name: github
  repo: hvx2x7hk8h-tech/Jugendensemble-WSP
  branch: main
  auth_type: pkce
  app_id: Ov23lieKohbi4JiTNOxc

media_folder: "images/uploads"
public_folder: "/images/uploads"
locale: de

collections:

  - name: "veranstaltungen"
    label: "🎭 Veranstaltungen"
    files:
      - label: "Alle Veranstaltungen"
        name: "events"
        file: "content/events.json"
        format: "json"
        fields:
          - label: "Veranstaltungen"
            name: "events"
            widget: "list"
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - {label: "Titel", name: "title", widget: "string"}
              - {label: "Untertitel", name: "subtitle", widget: "string", required: false, hint: "z.B. Eine Komödie nach Marc-Uwe Kling"}
              - {label: "Datum", name: "date", widget: "string", hint: "z.B. Sa., 15. März 2026"}
              - {label: "Uhrzeit (Beginn)", name: "time", widget: "string", required: false, hint: "z.B. 19:30 Uhr"}
              - {label: "Einlass ab", name: "doors", widget: "string", required: false, hint: "z.B. 19:00 Uhr"}
              - {label: "Dauer", name: "duration", widget: "string", required: false, hint: "z.B. ca. 90 Minuten"}
              - {label: "Veranstaltungsort", name: "venue", widget: "string"}
              - {label: "Adresse", name: "address", widget: "string", required: false}
              - {label: "Kurzbeschreibung", name: "description", widget: "text", required: false}
              - {label: "Kapazität (Gesamtplätze)", name: "capacity", widget: "number", default: 80}
              - {label: "Bereits reserviert", name: "reserved", widget: "number", default: 0}
              - {label: "Warteliste aktivieren?", name: "waitlist", widget: "boolean", default: true}
              - {label: "Poster / Bild", name: "image", widget: "image", required: false}
              - {label: "Vergangen?", name: "past", widget: "boolean", default: false}

  - name: "seiten"
    label: "📝 Seiteninhalte"
    files:
      - label: "Startseite"
        name: "home"
        file: "content/home.json"
        format: "json"
        fields:
          - {label: "Hero Hintergrundbild", name: "hero_image", widget: "image"}
          - {label: "Untertitel im Hero", name: "hero_subtitle", widget: "string"}
          - {label: "Einleitungstext", name: "intro_text", widget: "text"}
          - {label: "Zitat (Banner)", name: "quote", widget: "string", required: false}

      - label: "Über uns"
        name: "about"
        file: "content/about.json"
        format: "json"
        fields:
          - {label: "Haupttext", name: "body", widget: "text"}

  - name: "einstellungen"
    label: "⚙️ Einstellungen"
    files:
      - label: "Globale Einstellungen"
        name: "settings"
        file: "content/settings.json"
        format: "json"
        fields:
          - {label: "Kontakt E-Mail", name: "email", widget: "string"}
          - {label: "Instagram URL", name: "instagram", widget: "string", required: false}
          - {label: "Formspree ID", name: "formspree_id", widget: "string"}
          - {label: "EmailJS Service ID", name: "emailjs_service_id", widget: "string", required: false}
          - {label: "EmailJS Template ID", name: "emailjs_template_id", widget: "string", required: false}
          - {label: "EmailJS Public Key", name: "emailjs_public_key", widget: "string", required: false}
