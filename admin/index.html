<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>WSP Builder</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --g:#c9a84c;--gd:rgba(201,168,76,0.12);--gb:rgba(201,168,76,0.22);
  --bg:#08080a;--s1:#111114;--s2:#18181d;--s3:#222228;
  --t:#f0ede8;--m:#666;--danger:#e05555;--ok:#55c47a;
  --fd:'Cinzel',serif;--fb:'Raleway',sans-serif;
}
html,body{height:100%;overflow:hidden;font-family:var(--fb);background:var(--bg);color:var(--t)}

/* ── LOGIN ── */
#login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;background:var(--bg);z-index:9999}
#login h1{font-family:var(--fd);font-size:1rem;letter-spacing:.35em;color:var(--g);text-transform:uppercase}
#login p{color:var(--m);font-size:.82rem;font-weight:300}
.ln-btn{padding:.85rem 2.5rem;border:1px solid var(--g);background:none;color:var(--g);font-family:var(--fd);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .3s}
.ln-btn:hover{background:var(--g);color:var(--bg)}

/* ── SHELL ── */
#shell{display:none;flex-direction:column;height:100vh}
#shell.on{display:flex}

/* ── TOPBAR ── */
#topbar{
  height:54px;background:var(--s1);border-bottom:1px solid var(--gb);
  display:flex;align-items:center;padding:0 1.2rem;gap:.8rem;flex-shrink:0;z-index:100
}
.tb-logo{font-family:var(--fd);font-size:.62rem;letter-spacing:.3em;color:var(--g);text-transform:uppercase;margin-right:.5rem}
.tb-sep{width:1px;height:22px;background:var(--gb)}
.page-tabs{display:flex;gap:.2rem}
.ptab{padding:.4rem .9rem;font-family:var(--fd);font-size:.52rem;letter-spacing:.15em;text-transform:uppercase;border:1px solid transparent;color:var(--m);cursor:pointer;transition:all .25s;white-space:nowrap}
.ptab:hover{color:var(--t);border-color:var(--gb)}
.ptab.on{color:var(--g);border-color:var(--g);background:var(--gd)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:.6rem}
#status{font-size:.65rem;font-weight:300;color:var(--m);min-width:100px;text-align:right}
.tb-btn{padding:.4rem 1.1rem;font-family:var(--fd);font-size:.52rem;letter-spacing:.15em;text-transform:uppercase;border:1px solid var(--gb);background:none;color:var(--m);cursor:pointer;transition:all .25s;white-space:nowrap}
.tb-btn:hover{border-color:var(--g);color:var(--g)}
.tb-btn.save{background:var(--g);color:var(--bg);border-color:var(--g)}
.tb-btn.save:hover{background:#e8d5a3}
.tb-btn.out{border-color:rgba(224,85,85,.3);color:var(--danger)}
.view-toggle{display:flex;gap:0}
.vt{padding:.35rem .7rem;border:1px solid var(--gb);background:none;color:var(--m);cursor:pointer;font-size:.75rem;transition:all .25s}
.vt.on{background:var(--gd);border-color:var(--g);color:var(--g)}

/* ── CANVAS WRAP ── */
#canvas-wrap{flex:1;overflow:auto;background:#0c0c0e;display:flex;justify-content:center;align-items:flex-start;padding:1.5rem}
#canvas{
  background:#080808;width:100%;max-width:1200px;min-height:600px;
  transition:max-width .35s;position:relative;
}
#canvas.mobile{max-width:390px}

/* ── EDIT OVERLAY ── */
[data-editable]{
  position:relative;cursor:text;outline:none;
  transition:box-shadow .2s;
}
[data-editable]:hover{box-shadow:0 0 0 2px rgba(201,168,76,.35) inset}
[data-editable]:focus{box-shadow:0 0 0 2px var(--g) inset;outline:none}
[data-editable].editing{box-shadow:0 0 0 2px var(--g) inset}

.edit-label{
  position:absolute;top:-22px;left:0;
  background:var(--g);color:var(--bg);
  font-family:var(--fd);font-size:.45rem;letter-spacing:.15em;text-transform:uppercase;
  padding:.2rem .5rem;white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .2s;z-index:50
}
[data-editable]:hover .edit-label,[data-editable]:focus .edit-label{opacity:1}

/* ── FLOATING TOOLBAR ── */
#ftoolbar{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
  background:var(--s2);border:1px solid var(--gb);
  display:none;align-items:center;gap:.3rem;padding:.5rem .8rem;z-index:200;
  box-shadow:0 8px 32px rgba(0,0,0,.5)
}
#ftoolbar.show{display:flex}
.ft-label{font-family:var(--fd);font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;color:var(--g);padding-right:.5rem;border-right:1px solid var(--gb);margin-right:.3rem}
.ft-hint{font-size:.7rem;color:var(--m);font-weight:300}

/* ── EVENT SECTION ── */
.ev-builder{padding:1.5rem;background:var(--s2);border:1px solid var(--gb);margin:1rem 0}
.ev-card{background:var(--s1);border:1px solid var(--gb);padding:1.2rem;margin-bottom:.8rem;position:relative}
.ev-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.ev-card-title{font-family:var(--fd);font-size:.7rem;letter-spacing:.15em;color:var(--g)}
.ev-del{background:none;border:1px solid rgba(224,85,85,.3);color:var(--danger);width:26px;height:26px;cursor:pointer;font-size:.7rem;transition:all .2s}
.ev-del:hover{background:var(--danger);color:#fff}
.ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:.7rem}
.ev-field label{display:block;font-family:var(--fd);font-size:.48rem;letter-spacing:.18em;text-transform:uppercase;color:var(--m);margin-bottom:.35rem}
.ev-field input,.ev-field textarea{width:100%;background:var(--s3);border:1px solid var(--gb);padding:.55rem .8rem;color:var(--t);font-family:var(--fb);font-size:.82rem;font-weight:300;outline:none}
.ev-field input:focus,.ev-field textarea:focus{border-color:var(--g)}
.ev-toggle{display:flex;align-items:center;gap:.7rem;margin-top:.5rem}
.tgl{position:relative;width:36px;height:20px;flex-shrink:0}
.tgl input{opacity:0;width:0;height:0}
.tgl-s{position:absolute;inset:0;background:var(--s3);border:1px solid var(--gb);cursor:pointer;transition:.3s}
.tgl-s:before{content:'';position:absolute;height:12px;width:12px;left:3px;bottom:3px;background:var(--m);transition:.3s}
.tgl input:checked+.tgl-s{background:var(--gd);border-color:var(--g)}
.tgl input:checked+.tgl-s:before{transform:translateX(16px);background:var(--g)}
.ev-toggle span{font-size:.78rem;font-weight:300;color:var(--t)}
.ev-add{width:100%;padding:.65rem;background:none;border:1px dashed var(--gb);color:var(--m);font-family:var(--fd);font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .3s;margin-top:.5rem}
.ev-add:hover{border-color:var(--g);color:var(--g);background:var(--gd)}

/* ── SETTINGS PANEL ── */
#settings-panel{
  position:fixed;right:0;top:54px;bottom:0;width:300px;
  background:var(--s1);border-left:1px solid var(--gb);
  transform:translateX(100%);transition:transform .35s;z-index:150;
  overflow-y:auto;padding:1.5rem
}
#settings-panel.open{transform:translateX(0)}
.sp-title{font-family:var(--fd);font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:var(--g);margin-bottom:1.5rem;padding-bottom:.8rem;border-bottom:1px solid var(--gb)}
.sp-field{margin-bottom:1.2rem}
.sp-field label{display:block;font-family:var(--fd);font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;color:var(--m);margin-bottom:.4rem}
.sp-field input{width:100%;background:var(--s2);border:1px solid var(--gb);padding:.65rem .9rem;color:var(--t);font-family:var(--fb);font-size:.85rem;font-weight:300;outline:none}
.sp-field input:focus{border-color:var(--g)}
.sp-field .hint{font-size:.68rem;color:var(--m);margin-top:.25rem;font-weight:300}

/* ── TOAST ── */
#toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--gb);padding:.85rem 1.8rem;font-size:.8rem;font-weight:300;z-index:9999;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
#toast.show{opacity:1}
#toast.ok{border-color:var(--ok);color:var(--ok)}
#toast.err{border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div style="font-family:var(--fd);font-size:.55rem;letter-spacing:.5em;color:var(--g);text-transform:uppercase;margin-bottom:-.5rem">Jugendensemble WSP</div>
  <h1>Website Builder</h1>
  <p>Melde dich an um deine Website zu bearbeiten</p>
  <button class="ln-btn" onclick="netlifyIdentity.open()">Einloggen</button>
</div>

<!-- SHELL -->
<div id="shell">

  <!-- TOPBAR -->
  <div id="topbar">
    <span class="tb-logo">⬛ WSP</span>
    <div class="tb-sep"></div>
    <div class="page-tabs">
      <div class="ptab on" onclick="loadPage('home',this)">🏠 Start</div>
      <div class="ptab" onclick="loadPage('about',this)">👥 Über uns</div>
      <div class="ptab" onclick="loadPage('events',this)">🎭 Events</div>
      <div class="ptab" onclick="loadPage('contact',this)">✉️ Kontakt</div>
      <div class="ptab" onclick="loadPage('impressum',this)">📋 Impressum</div>
      <div class="ptab" onclick="loadPage('datenschutz',this)">🔒 Datenschutz</div>
    </div>
    <div class="tb-right">
      <div class="view-toggle">
        <button class="vt on" onclick="setView('desktop',this)" title="Desktop">🖥</button>
        <button class="vt" onclick="setView('mobile',this)" title="Mobile">📱</button>
      </div>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="toggleSettings()">⚙️ Einstellungen</button>
      <button class="tb-btn" onclick="window.open('/',`_blank`)">🌐 Vorschau</button>
      <span id="status"></span>
      <button class="tb-btn save" id="savebtn" onclick="saveAll()">Speichern</button>
      <button class="tb-btn out" onclick="netlifyIdentity.logout()">Abmelden</button>
    </div>
  </div>

  <!-- CANVAS -->
  <div id="canvas-wrap">
    <div id="canvas">
      <div id="page-content" style="min-height:400px;display:flex;align-items:center;justify-content:center;color:var(--m);font-size:.8rem;font-weight:300">Wird geladen…</div>
    </div>
  </div>

</div>

<!-- FLOATING TOOLBAR -->
<div id="ftoolbar">
  <span class="ft-label">Bearbeiten</span>
  <span class="ft-hint">Klicke auf einen Text und tippe direkt</span>
</div>

<!-- SETTINGS PANEL -->
<div id="settings-panel">
  <div class="sp-title">⚙️ Globale Einstellungen</div>
  <div class="sp-field"><label>Kontakt E-Mail</label><input type="email" id="set-email" placeholder="jugendensemblewsp@gmail.com"></div>
  <div class="sp-field"><label>Instagram URL</label><input type="url" id="set-ig" placeholder="https://instagram.com/…"></div>
  <div class="sp-field"><label>Formspree ID</label><input type="text" id="set-fp" placeholder="xpzvwkrq"><div class="hint">Von formspree.io — für das Kontaktformular</div></div>
  <button class="tb-btn save" style="width:100%;margin-top:1rem" onclick="saveSettings()">Einstellungen speichern</button>
</div>

<div id="toast"></div>

<script>
// ── STATE ──
let token = null, allData = {}, curPage = 'home', events = [], settingsPanelOpen = false;
const PAGES = ['home','about','events','contact','impressum','datenschutz'];

// ── AUTH ──
netlifyIdentity.on('init', u => { if(u) login(u) });
netlifyIdentity.on('login', u => { login(u); netlifyIdentity.close() });
netlifyIdentity.on('logout', () => { document.getElementById('shell').classList.remove('on'); document.getElementById('login').style.display='flex' });

async function login(u){
  token = u.token?.access_token;
  if(!token){ await delay(700); token = netlifyIdentity.currentUser()?.token?.access_token }
  document.getElementById('login').style.display='none';
  document.getElementById('shell').classList.add('on');
  await loadAllData();
  loadPage('home', document.querySelector('.ptab.on'));
}

// ── GIT GATEWAY ──
async function gitGet(p){ try{ const r=await fetch(`/.netlify/git/github/contents/${p}`,{headers:{Authorization:`Bearer ${token}`}}); return r.ok?await r.json():null }catch{return null} }
async function gitPut(p,content,sha){ try{ const r=await fetch(`/.netlify/git/github/contents/${p}`,{method:'PUT',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Update ${p}`,content:b64e(content),sha})}); return r.ok }catch{return false} }
async function loadFile(p){ const d=await gitGet(p); if(!d)return{content:{},sha:null}; return{content:JSON.parse(b64d(d.content)),sha:d.sha} }

async function loadAllData(){
  setStatus('Wird geladen…','');
  const files=['content/home.json','content/about.json','content/events.json','content/contact_page.json','content/impressum.json','content/datenschutz.json','content/settings.json'];
  for(const f of files){ allData[f]=await loadFile(f) }
  events=[...(allData['content/events.json']?.content?.events||[])];
  // populate settings
  const s=allData['content/settings.json']?.content||{};
  sv('set-email',s.email); sv('set-ig',s.instagram); sv('set-fp',s.formspree_id);
  setStatus('','');
}

// ── PAGE RENDERER ──
const CSS_VARS = `
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap');
  :root{--bg:#080808;--surface:#101010;--surface-2:#181818;--gold:#c9a84c;--gold-light:#e8d5a3;--gold-dim:rgba(201,168,76,0.08);--text:#f0ede8;--text-muted:#888;--border:rgba(201,168,76,0.2);--font-display:'Cinzel',serif;--font-body:'Raleway',sans-serif}

  .divider{width:50px;height:1px;background:var(--gold);margin:1.2rem 0}
  .btn{display:inline-block;padding:.85rem 2.3rem;font-family:var(--font-display);font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;text-decoration:none;border:1px solid var(--gold);color:var(--gold);transition:all .3s;cursor:pointer;background:none}

  .hero-c{position:relative;z-index:2;max-width:780px;padding:2rem}
  .hero-eye{display:block;font-family:var(--font-display);font-size:.58rem;letter-spacing:.5em;color:var(--gold);text-transform:uppercase;margin-bottom:1.2rem}
  .hero h1{font-family:var(--font-display);font-size:clamp(2.5rem,6vw,4.5rem);font-weight:500;letter-spacing:.05em;line-height:1.15;margin-bottom:1.2rem}

  .ev-img{width:70px;height:90px;object-fit:cover}
  .ev-date{font-family:var(--font-display);font-size:.58rem;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:.3rem}

  footer{background:#040404;border-top:1px solid var(--border);padding:3rem 4rem}

</style>`;

const FOOTER_HTML = `<footer><div class="fi"><a href="#" class="fl">Jugendensemble WSP</a><ul class="flinks"><li><a href="#">Über uns</a></li><li><a href="#">Veranstaltungen</a></li><li><a href="#">Kontakt</a></li><li><a href="#">Impressum</a></li><li><a href="#">Datenschutz</a></li></ul></div><div class="fb"><span class="fc">© ${new Date().getFullYear()} Jugendensemble WSP — Alle Rechte vorbehalten.</span><span class="fc">Bonn, Deutschland</span></div></footer>`;

function pageHTML(page){
  const h=allData['content/home.json']?.content||{};
  const a=allData['content/about.json']?.content||{};
  const c=allData['content/contact_page.json']?.content||{};
  const i=allData['content/impressum.json']?.content||{};
  const d=allData['content/datenschutz.json']?.content||{};

  const editable=(field,tag='span',extra='')=>`<${tag} contenteditable="true" data-field="${field}" ${extra} onblur="onEdit(this)" onfocus="onFocus(this)" onkeydown="onKey(event)">${getField(field)}</${tag}>`;

function getField(f){
  const [sec,key]=f.split('.');
  const map={home:'content/home.json',about:'content/about.json',contact:'content/contact_page.json',impressum:'content/impressum.json',datenschutz:'content/datenschutz.json'};
  return allData[map[sec]]?.content?.[key]||'';
}

function renderEventsHTML(){
  if(!events.length) return '<div class="no-ev"><p>Noch keine Veranstaltungen. Füge unten eine hinzu!</p></div>';
  return events.map((ev,i)=>`
    <div class="ev-card">
      ${ev.image?`<img class="ev-img" src="${ev.image}" alt="${ev.title}">`:'<div style="width:70px;height:90px;background:var(--surface-2);border:1px solid var(--border)"></div>'}
      <div>
        <div class="ev-date">${ev.date||'Datum'}${ev.time?' · '+ev.time:''}</div>
        <div class="ev-title">${ev.title||'Titel'}</div>
        <div class="ev-venue">${ev.venue||'Ort'}</div>
      </div>
      ${ev.past?'<span class="past-badge">Vergangen</span>':ev.ticket_url?`<a href="#" class="btn btn-p">Tickets</a>`:'<span class="past-badge">Demnächst</span>'}
    </div>`).join('');
}

function renderEventEditor(){
  const c=document.getElementById('ev-editor');
  if(!c)return;
  c.innerHTML=events.map((ev,i)=>`
    <div class="ev-card" style="margin-bottom:.8rem">
      <div class="ev-card-header"><span class="ev-card-title">${ev.title||'Veranstaltung '+(i+1)}</span><button class="ev-del" onclick="removeEvent(${i})">✕</button></div>
      <div class="ev-grid">
        <div class="ev-field"><label>Titel</label><input value="${ev.title||''}" oninput="events[${i}].title=this.value;refreshEvList()"></div>
        <div class="ev-field"><label>Datum</label><input value="${ev.date||''}" placeholder="Sa., 15. März 2026" oninput="events[${i}].date=this.value;refreshEvList()"></div>
        <div class="ev-field"><label>Uhrzeit</label><input value="${ev.time||''}" placeholder="19:30 Uhr" oninput="events[${i}].time=this.value;refreshEvList()"></div>
        <div class="ev-field"><label>Ort</label><input value="${ev.venue||''}" placeholder="Theater Bonn" oninput="events[${i}].venue=this.value;refreshEvList()"></div>
      </div>
      <div class="ev-field"><label>Ticket-Link (Eventbrite)</label><input type="url" value="${ev.ticket_url||''}" placeholder="https://eventbrite.de/…" oninput="events[${i}].ticket_url=this.value"></div>
      <div class="ev-field"><label>Bild URL</label><input type="url" value="${ev.image||''}" placeholder="https://…" oninput="events[${i}].image=this.value;refreshEvList()"></div>
      <div class="ev-toggle"><label class="tgl"><input type="checkbox" ${ev.past?'checked':''} onchange="events[${i}].past=this.checked;refreshEvList()"><span class="tgl-s"></span></label><span>Vorstellung ist vorbei</span></div>
    </div>`).join('');
}

function refreshEvList(){ const el=document.getElementById('ev-list-render'); if(el) el.innerHTML=renderEventsHTML() }
function addEvent(){ events.push({title:'Neue Veranstaltung',date:'',time:'',venue:'',description:'',ticket_url:'',image:'',past:false}); renderEventEditor(); refreshEvList() }
function removeEvent(i){ if(!confirm(`"${events[i].title}" löschen?`))return; events.splice(i,1); renderEventEditor(); refreshEvList() }

// ── LOAD PAGE ──
async function loadPage(page, tab){
  curPage=page;
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('on'));
  if(tab) tab.classList.add('on');
  const pc=document.getElementById('page-content');
  pc.innerHTML=CSS_VARS+pageHTML(page);
  if(page==='events') renderEventEditor();
  document.getElementById('ftoolbar').classList.add('show');
}

// ── INLINE EDITING ──
const fieldMap={'home.hero_subtitle':['content/home.json','hero_subtitle'],'home.intro_text':['content/home.json','intro_text'],'home.quote':['content/home.json','quote'],'about.left_title':['content/about.json','left_title'],'about.left_quote':['content/about.json','left_quote'],'about.body':['content/about.json','body'],'about.stat1_value':['content/about.json','stat1_value'],'about.stat1_label':['content/about.json','stat1_label'],'about.stat2_value':['content/about.json','stat2_value'],'about.stat2_label':['content/about.json','stat2_label'],'about.stat3_value':['content/about.json','stat3_value'],'about.stat3_label':['content/about.json','stat3_label'],'contact.intro':['content/contact_page.json','intro'],'contact.location':['content/contact_page.json','location'],'impressum.name':['content/impressum.json','name'],'impressum.street':['content/impressum.json','street'],'impressum.city':['content/impressum.json','city'],'impressum.email':['content/impressum.json','email'],'impressum.note':['content/impressum.json','note'],'datenschutz.name':['content/datenschutz.json','name'],'datenschutz.street':['content/datenschutz.json','street'],'datenschutz.city':['content/datenschutz.json','city'],'datenschutz.email':['content/datenschutz.json','email']};

function onEdit(el){
  const f=el.dataset.field;
  if(!fieldMap[f])return;
  const[file,key]=fieldMap[f];
  if(!allData[file].content) allData[file].content={};
  allData[file].content[key]=el.innerText;
  el.classList.remove('editing');
}
function onFocus(el){ el.classList.add('editing') }
function onKey(e){ if(e.key==='Escape'){ e.target.blur() } }

// ── SAVE ALL ──
async function saveAll(){
  setStatus('Speichern…','');
  document.getElementById('savebtn').disabled=true;

  // collect all editable fields into allData
  document.querySelectorAll('[data-field]').forEach(el=>{
    const f=el.dataset.field;
    if(!fieldMap[f])return;
    const[file,key]=fieldMap[f];
    if(!allData[file].content) allData[file].content={};
    allData[file].content[key]=el.innerText;
  });

  // add events
  allData['content/events.json'].content={events};

  let ok=true;
  for(const[path,d] of Object.entries(allData)){
    if(!d.sha) continue;
    const success=await gitPut(path,JSON.stringify(d.content,null,2),d.sha);
    if(!success) ok=false;
  }

  document.getElementById('savebtn').disabled=false;
  if(ok){ toast('✓ Gespeichert! Seite wird in ca. 30 Sek. aktualisiert.','ok'); setStatus('Gespeichert ✓','ok') }
  else{ toast('Fehler! Bitte erneut versuchen.','err'); setStatus('Fehler','err') }
  setTimeout(()=>setStatus('',''),5000);
}

async function saveSettings(){
  const s=allData['content/settings.json'];
  s.content={email:gv('set-email'),instagram:gv('set-ig'),formspree_id:gv('set-fp')};
  const ok=await gitPut('content/settings.json',JSON.stringify(s.content,null,2),s.sha);
  toast(ok?'✓ Einstellungen gespeichert!':'Fehler beim Speichern.',ok?'ok':'err');
}

// ── UI HELPERS ──
function setView(v,btn){ document.getElementById('canvas').className=v==='mobile'?'mobile':''; document.querySelectorAll('.vt').forEach(b=>b.classList.remove('on')); btn.classList.add('on') }
function toggleSettings(){ settingsPanelOpen=!settingsPanelOpen; document.getElementById('settings-panel').classList.toggle('open',settingsPanelOpen) }
function setStatus(m,t){ const el=document.getElementById('status'); el.textContent=m; el.style.color=t==='ok'?'#55c47a':t==='err'?'#e05555':'#666' }
function toast(m,t=''){ const el=document.getElementById('toast'); el.textContent=m; el.className='toast show '+(t||''); setTimeout(()=>el.classList.remove('show'),4000) }
function sv(id,v){ const el=document.getElementById(id); if(el&&v!=null) el.value=v }
function gv(id){ return document.getElementById(id)?.value||'' }
function delay(ms){ return new Promise(r=>setTimeout(r,ms)) }
function b64e(s){ return btoa(unescape(encodeURIComponent(s))) }
function b64d(s){ return decodeURIComponent(escape(atob(s.replace(/\n/g,'')))) }
