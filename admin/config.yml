backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: de

collections:

  - name: "veranstaltungen"
    label: "🎭 Veranstaltungen"
    files:
      - label: "Alle Veranstaltungen"
        name: "events"
        file: "content/events.json"
        format: "json"
        fields:
          - label: "Veranstaltungen"
            name: "events"
            widget: "list"
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - {label: "Titel", name: "title", widget: "string", hint: "z.B. Känguru Chroniken"}
              - {label: "Datum", name: "date", widget: "string", hint: "z.B. Samstag, 15. März 2026"}
              - {label: "Uhrzeit", name: "time", widget: "string", required: false, hint: "z.B. 19:30 Uhr"}
              - {label: "Veranstaltungsort", name: "venue", widget: "string", hint: "z.B. Theater Bonn – Opernhaus"}
              - {label: "Kurzbeschreibung", name: "description", widget: "text", required: false}
              - {label: "Ticket-Link", name: "ticket_url", widget: "string", required: false, hint: "Link zu Eventbrite oder ähnlichem"}
              - {label: "Poster / Bild", name: "image", widget: "image", required: false}
              - {label: "Vergangen?", name: "past", widget: "boolean", default: false, hint: "Aktivieren wenn die Vorstellung vorbei ist"}

  - name: "seiten"
    label: "📝 Seiteninhalte"
    files:
      - label: "Startseite"
        name: "home"
        file: "content/home.json"
        format: "json"
        fields:
          - {label: "Untertitel im Hero (unter dem Titel)", name: "hero_subtitle", widget: "string"}
          - {label: "Kurztext (Wer sind wir? - Startseite)", name: "intro_text", widget: "text"}

      - label: "Über uns"
        name: "about"
        file: "content/about.json"
        format: "json"
        fields:
          - {label: "Über uns — Text", name: "body", widget: "text", hint: "Doppelte Leerzeile = neuer Absatz"}

  - name: "einstellungen"
    label: "⚙️ Einstellungen"
    files:
      - label: "Globale Einstellungen"
        name: "settings"
        file: "content/settings.json"
        format: "json"
        fields:
          - {label: "Kontakt E-Mail", name: "email", widget: "string"}
          - {label: "Instagram URL", name: "instagram", widget: "string", required: false, hint: "https://instagram.com/..."}
          - {label: "Formspree ID (Kontaktformular)", name: "formspree_id", widget: "string", hint: "Die ID von formspree.io, z.B. xpzvwkrq"}
