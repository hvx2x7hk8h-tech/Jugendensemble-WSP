backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: de

collections:

  - name: "veranstaltungen"
    label: "🎭 Veranstaltungen"
    files:
      - label: "Alle Veranstaltungen"
        name: "events"
        file: "content/events.json"
        format: "json"
        fields:
          - label: "Veranstaltungen"
            name: "events"
            widget: "list"
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - {label: "Titel", name: "title", widget: "string"}
              - {label: "Datum", name: "date", widget: "string", hint: "z.B. Samstag, 15. März 2026"}
              - {label: "Uhrzeit", name: "time", widget: "string", required: false, hint: "z.B. 19:30 Uhr"}
              - {label: "Veranstaltungsort", name: "venue", widget: "string"}
              - {label: "Kurzbeschreibung", name: "description", widget: "text", required: false}
              - {label: "TicketTailor Widget-ID", name: "tt_widget_id", widget: "string", required: false, hint: "Aus TicketTailor Dashboard → Events → Embed. Leer lassen wenn noch nicht eingerichtet."}
              - {label: "Ticket-Link (Fallback)", name: "ticket_url", widget: "string", required: false, hint: "Nur wenn keine TicketTailor Widget-ID vorhanden"}
              - {label: "Poster / Bild", name: "image", widget: "image", required: false}
              - {label: "Vergangen?", name: "past", widget: "boolean", default: false}

  - name: "seiten"
    label: "📝 Seiteninhalte"
    files:
      - label: "Startseite"
        name: "home"
        file: "content/home.json"
        format: "json"
        fields:
          - {label: "Hero Hintergrundbild", name: "hero_image", widget: "image", hint: "Bild das im Hintergrund aller Seiten erscheint"}
          - {label: "Untertitel im Hero", name: "hero_subtitle", widget: "string"}
          - {label: "Einleitungstext", name: "intro_text", widget: "text"}
          - {label: "Zitat (Banner)", name: "quote", widget: "string", required: false}

      - label: "Über uns"
        name: "about"
        file: "content/about.json"
        format: "json"
        fields:
          - {label: "Haupttext", name: "body", widget: "text", hint: "Doppelte Leerzeile = neuer Absatz"}

  - name: "einstellungen"
    label: "⚙️ Einstellungen"
    files:
      - label: "Globale Einstellungen"
        name: "settings"
        file: "content/settings.json"
        format: "json"
        fields:
          - {label: "Kontakt E-Mail", name: "email", widget: "string"}
          - {label: "Instagram URL", name: "instagram", widget: "string", required: false}
          - {label: "Formspree ID", name: "formspree_id", widget: "string"}
